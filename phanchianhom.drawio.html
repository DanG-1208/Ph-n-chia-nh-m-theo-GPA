8\&quot; parent=\&quot;1\&quot; style=\&quot;ellipse;html=1;shape=endState;fillColor=#000000;strokeColor=#ff0000;\&quot; value=\&quot;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;30\&quot; width=\&quot;30\&quot; x=\&quot;500\&quot; y=\&quot;1055\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;ZyIqgw533nRup1Fr-qFn-41\&quot; parent=\&quot;1\&quot; style=\&quot;whiteSpace=wrap;html=1;aspect=fixed;\&quot; value=\&quot;&amp;lt;p data-start=&amp;quot;51&amp;quot; data-end=&amp;quot;288&amp;quot;&amp;gt;&amp;lt;font dir=&amp;quot;auto&amp;quot;&amp;gt;Mục đích của thuật toán này là tự động chia sinh viên thành các nhóm có kết quả học tập cân bằng. Hệ thống sử dụng điểm trung bình tích lũy (GPA) của sinh viên làm tiêu chí chính để đảm bảo điểm GPA trung bình của mỗi nhóm càng giống nhau càng tốt.&amp;lt;/font&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;p data-start=&amp;quot;290&amp;quot; data-end=&amp;quot;497&amp;quot;&amp;gt;&amp;lt;font dir=&amp;quot;auto&amp;quot;&amp;gt;Đầu tiên, tất cả sinh viên được sắp xếp theo thứ tự giảm dần dựa trên điểm trung bình (GPA). Sau đó, mỗi sinh viên được phân vào nhóm có điểm trung bình thấp nhất hiện tại. Quá trình này tiếp tục cho đến khi tất cả sinh viên được phân nhóm.&amp;lt;/font&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;p data-start=&amp;quot;499&amp;quot; data-end=&amp;quot;806&amp;quot;&amp;gt;&amp;lt;font dir=&amp;quot;auto&amp;quot;&amp;gt;Sau khi chia nhóm, hệ thống sẽ tính điểm trung bình (GPA) của mỗi nhóm và so sánh điểm trung bình cao nhất và thấp nhất của nhóm đó. Nếu chênh lệch vượt quá &amp;lt;/font&amp;gt;&amp;lt;strong data-start=&amp;quot;645&amp;quot; data-end=&amp;quot;663&amp;quot;&amp;gt;&amp;lt;font dir=&amp;quot;auto&amp;quot;&amp;gt;0,2 điểm GPA&amp;lt;/font&amp;gt;&amp;lt;/strong&amp;gt;&amp;lt;font dir=&amp;quot;auto&amp;quot;&amp;gt; , hệ thống sẽ thực hiện quá trình cân bằng lại bằng cách hoán đổi sinh viên giữa các nhóm cho đến khi chênh lệch giảm xuống hoặc không thể cải thiện thêm được nữa.&amp;lt;/font&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;br/&amp;gt;&amp;lt;p data-start=&amp;quot;808&amp;quot; data-end=&amp;quot;933&amp;quot; data-is-last-node=&amp;quot;&amp;quot; data-is-only-node=&amp;quot;&amp;quot;&amp;gt;&amp;lt;font dir=&amp;quot;auto&amp;quot;&amp;gt;Phương pháp này đơn giản, hiệu quả và có thể mở rộng quy mô cho bất kỳ số lượng học sinh hoặc nhóm nào, đồng thời vẫn đảm bảo sự công bằng giữa các đội.&amp;lt;/font&amp;gt;&amp;lt;/p&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;360\&quot; width=\&quot;360\&quot; x=\&quot;530\&quot; y=\&quot;340\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n      &lt;/root&gt;\n    &lt;/mxGraphModel&gt;\n  &lt;/diagram&gt;\n&lt;/mxfile&gt;\n&quot;}"></div>
